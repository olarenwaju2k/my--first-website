<!DOCTYPE html>
<html>
<head>
<style>
    body {
        font-family: Arial, sans-serif;
        max-width: 800px;
        margin: 40px auto;
        padding: 20px;
        line-height: 1.6;
    }

    h1 {
        font-size: 40px;
    }

    h2 {
        margin-top: 30px;
    }
    .completed {
    text-decoration: line-through;
    opacity: 0.5;
    cursor: pointer;
}
</style>
   <tittle>My first website</tittle>
</head>
<body>
    <h1>My To-Do List 📝</h1>
    <input type="text" id="taskInput" placeholder="Enter a task" onkeydown="if(event.key==='Enter') addTask()">
<button onclick="addTask()">Add Task</button>

<ul id="taskList"></ul>

     <h1>Welcome to my website!</h1>
     <p>I`m learning web development and AI automation </p>
          <h2 id="goal">My Goal</h2>
          <p>I want to build useful website and automation system.</p>
<button onclick="changeText()">Click Me</button>

<script>
    function changeText() {
    document.getElementById("goal").innerHTML =
        "My goal is to become a successful web developer! 🚀";
    }
</script>
<script>
    function addTask() {
        let input = document.getElementById("taskInput");
        let task = input.value;

        if (task !== "") {
            let list = document.getElementById("taskList");
            let item = document.createElement("li");

            item.innerHTML = '<span onclick="this.classList.toggle(\'completed\')">' + task + '</span> <button onclick="this.parentElement.remove()">❌</button>';
            list.appendChild(item);

            input.value = "";
        }
    }
</script>
</body>
</html>
